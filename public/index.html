<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#245744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jantar 4º RCB" />
    <meta name="description" content="Cadastro e consulta de convidados do jantar." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <title>Recepção do Jantar</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #faf8f3; }
      body { overflow: hidden; }
      #root { display: flex; min-height: 100%; height: 100%; flex: 1; }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
